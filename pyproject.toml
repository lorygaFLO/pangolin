[project]
name = "pangolin"
version = "0.1.0"
description = "Data processing pipeline using Prefect"
requires-python = ">=3.10"
dependencies = [
    "cramjam==2.10.0",
    "fastparquet==2024.11.0",
    "fsspec==2025.3.2",
    "numpy==2.2.3",
    "packaging==24.2",
    "pandas==2.2.3",
    "polars==1.23.0",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.1",
    "PyYAML==6.0.2",
    "setuptools==76.0.0",
    "six==1.17.0",
    "tzdata==2025.1",
    "Faker==37.12.0",
    "prefect==3.6.26",
    "fastapi==0.136.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",
    "typer==0.21.2",
    "python-dotenv==1.2.3",
]

[project.scripts]
pangolin = "pangolin.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pangolin*"]

[tool.setuptools.package-data]
"pangolin._scaffold" = ["project_template/**/*"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
