# Pangolin Prefect bootstrap manifest.
#
# Resolution rules:
#   - inline literal     -> used as-is
#   - "${ENV_VAR}"       -> resolved from container env (missing => empty)
#   - null / "" / {}     -> created EMPTY; if a non-empty value already exists
#                           on the server it is preserved (so user UI edits
#                           survive rebuilds)
#
# Variable names: Prefect only accepts lowercase letters, digits, "-" and "_".
# To feed a Variable into the settings, say which env var it becomes with
# `expose_as_env` (same key the secret blocks below use). `pangolin deploy`
# exports it before the SETTINGS class is imported; a Variable without
# `expose_as_env` is just stored in Prefect.
#
# DO NOT commit plaintext secrets here. Use ${ENV_VAR} or null.

variables:
  - name: pangolin_input_glob
    value: "*.csv"
  - name: pangolin_notes
    value: null            # created empty, user fills via UI

  # NOTE: folder names (INPUT_FOLDER_NAME, DELIVERY_FOLDER_NAME, ...) are NOT
  # configured here. They come only from config/data_structure.yaml (every
  # node with a `_settings_key`); an env var of that name is ignored.

  # IO options — real SETTINGS fields, editable in the Prefect UI
  - name: csv_delimiter
    value: ";"
    expose_as_env: CSV_DELIMITER
  - name: output_format
    value: parquet
    expose_as_env: OUTPUT_FORMAT

blocks:
  # Main settings block. Every key is exported as an env var by
  # `pangolin deploy` before the SETTINGS class is imported, so
  # Pydantic-Settings (including any fields you added in custom/settings.py,
  # see the "Adding Custom Settings" doc) picks it up.
  - name: pangolin-settings
    type: json
    value:
      PROJECT_NAME: pangolin
      BASEPATH: /app
      DATAPATH: /app/data
      FS_PROTOCOL: file
      DISABLE_REPORTS: "False"

  # Example secret block, populated from container env via .env.docker.
  # `expose_as_env` makes `pangolin deploy` export the secret value into
  # os.environ under that name before the flow imports anything — same
  # pattern for any sensitive custom/settings.py field, e.g. a Postgres URL:
  #   - name: pangolin-database-url
  #     type: secret
  #     value: "${DATABASE_URL}"
  #     expose_as_env: DATABASE_URL
  # (with `DATABASE_URL: str` declared in custom/settings.py, and the real
  # value only ever in docker/.env.docker, never committed)
  - name: pangolin-azure-conn
    type: secret
    value: "${AZURE_STORAGE_CONNECTION_STRING}"
    expose_as_env: AZURE_STORAGE_CONNECTION_STRING

  # Empty placeholder secret — user fills it via the Prefect UI.
  - name: pangolin-extra-secret
    type: secret
    value: null
